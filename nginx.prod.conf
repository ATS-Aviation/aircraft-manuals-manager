server {
    listen       80;
    server_name  manuals.ats-technic.com;

    client_max_body_size 100M;

    # React frontend - serve static build
    location / {
        root /var/www/aircraft-manuals-manager/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    }

    # Cache static assets
    location /static/ {
        root /var/www/aircraft-manuals-manager/frontend/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Manuals app - serve static files directly
    location /manuals/qatar/b737max/maintenance-manual/ {
        alias /var/www/manuals/qatar/b737max/maintenance-manual/;
        index ToolboxRemote.html;
        try_files $uri $uri/ /manuals/qatar/b737max/maintenance-manual/ToolboxRemote.html;
    }
}
